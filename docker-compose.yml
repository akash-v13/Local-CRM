# Local development stack. Start everything with:  docker compose up --build
#   UI (agent console, Operations Portal, test webform): http://localhost:5173
#   API docs:                                             http://localhost:8000/docs
#   Mock shop/shipping API (for connector demos):         http://localhost:8100/docs
#   Test mail server (GreenMail): SMTP localhost:3025, IMAP localhost:3143 (any password)
#
# Services: db (Postgres) · api (FastAPI) · worker (background jobs: enrichment, email)
#           ui (Vite dev server) · mocks (fake external APIs) · mail (test mail server)

# Settings shared by the api and the worker.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://resolve:resolve@db:5432/resolve
  APP_ENV: local
  # Local development only: let connectors call the mock API over plain http
  # inside the Docker network. Production uses https and public hosts only.
  CONNECTOR_ALLOWED_HOSTS: mocks
  CONNECTOR_ALLOW_HTTP: "true"
  # Local development only: let inboxes use the test mail server without TLS.
  EMAIL_ALLOWED_HOSTS: mail
  EMAIL_ALLOW_INSECURE: "true"
  # AI reply drafting: taken from your shell (`export ANTHROPIC_API_KEY=...` before
  # `docker compose up`). Empty = drafting off; the UI explains how to turn it on.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Reading customer messages with TypeSafe's Jev (optional; falls back to Claude, then patterns).
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve  # local only — never reuse outside your machine
      POSTGRES_DB: resolve
    ports:
      - "5432:5432"  # so you can connect with a DB client or run the API outside Docker
    volumes:
      - db-data:/var/lib/postgresql/data  # data survives restarts; `docker compose down -v` wipes it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve -d resolve"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Dev mode: migrate, then run with auto-reload. Code is mounted from your
    # machine, so saving a file restarts the server — no rebuild needed.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  worker:
    build: ./backend
    environment: *backend-env
    depends_on:
      api:
        condition: service_started  # the api applies migrations on start
    # Restarts automatically when backend code changes (watchfiles comes with uvicorn).
    command: watchfiles --filter python "python -m app.worker" app
    volumes:
      - ./backend/app:/app/app

  mocks:
    build: ./backend
    ports:
      - "8100:8100"
    command: uvicorn mocks.shop:app --host 0.0.0.0 --port 8100 --reload
    volumes:
      - ./backend/mocks:/app/mocks

  mail:
    # GreenMail: a throwaway SMTP + IMAP server for trying the email channel.
    # Any address works and any password is accepted; mail is lost on restart.
    # In the app, link an inbox with host "mail", IMAP 3143 / SMTP 3025, security "none".
    image: greenmail/standalone:2.1.4
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - "3025:3025"  # SMTP
      - "3143:3143"  # IMAP

  ui:
    image: node:24-slim
    working_dir: /app
    environment:
      API_TARGET: http://api:8000  # vite.config.ts forwards /api/* here
    ports:
      - "5173:5173"
    depends_on:
      - api
    # Installs dependencies inside the container (Linux builds of native packages),
    # then runs the Vite dev server. Saving a file updates the browser instantly.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules separate from the one on your Mac.
      - ui-node-modules:/app/node_modules

volumes:
  db-data:
  ui-node-modules:
