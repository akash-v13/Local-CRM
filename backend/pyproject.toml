[project]
name = "resolve-backend"
version = "0.1.0"
description = "Backend for the customer care resolution platform: case intake, lifecycle, and (soon) enrichment and compensation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.9",
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text: one instruction per line, unwrapped - wrapping would change what the model reads.
"app/ai/prompts.py" = ["E501"]
